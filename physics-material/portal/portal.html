<style>
/* Layout: one ledger-style column. Tabs: Student report, Teacher dashboard, Analysis, Test comparison. A filter bar (branch, class, section, student) sits above every cohort view. The question map is drawn like an OMR sheet. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F4F6F8; --fg:#15202B; --muted:#586674; --line:#D3DAE1;
  --accent:#2446C9; --accent-fg:#FFFFFF; --good:#1E7F55; --bad:#C0392B; --warn:#9A5F08; --skip:#B9C3CD; --warn-bg:#FBF3E4;
  --s-p:#1F5FBF; --s-c:#B45F06; --s-m:#7B3FB5; --s-o:#586674;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151C; --surface:#16202A; --surface-2:#1B2733; --fg:#E6ECF1; --muted:#93A1AE; --line:#2A3846;
    --accent:#7C9BFF; --accent-fg:#0E151C; --good:#4CC38A; --bad:#FF7D6E; --warn:#E3A646; --skip:#3B4B5A; --warn-bg:#2A2414;
    --s-p:#7FA8FF; --s-c:#F2A957; --s-m:#C79BF0; --s-o:#93A1AE; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151C; --surface:#16202A; --surface-2:#1B2733; --fg:#E6ECF1; --muted:#93A1AE; --line:#2A3846;
  --accent:#7C9BFF; --accent-fg:#0E151C; --good:#4CC38A; --bad:#FF7D6E; --warn:#E3A646; --skip:#3B4B5A; --warn-bg:#2A2414;
  --s-p:#7FA8FF; --s-c:#F2A957; --s-m:#C79BF0; --s-o:#93A1AE; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--body);padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:650}
h3{font-size:1.02rem;font-weight:650}
p{margin:0}
a{color:var(--accent)}
#main{display:flex;flex-direction:column;gap:26px;min-width:0}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-block:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.omr{display:flex;gap:4px}
.omr i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--fg);display:block}
.omr i.on{background:var(--fg)}
.brand h1{font-size:1.2rem;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12px}
.testbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.testbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:100%}
.testname{font:500 13px var(--mono)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:10px 16px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}

.shead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.shead h2{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:700;line-height:1.1}
.who{display:flex;flex-direction:column;gap:6px;min-width:0}
.back{font-weight:500;text-decoration:none}
.back:hover{text-decoration:underline}
.pick{display:flex;flex-direction:column;gap:4px}
.pick select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:210px;max-width:100%}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.btn{padding:9px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:8px;font-weight:600}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.ghost{background:transparent;color:var(--accent)}
.note{font:12px var(--mono);color:var(--muted)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:130px;max-width:100%}

/* headline numbers */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.hc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hc b{font:700 2.3rem/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hc b i{font:500 1rem var(--mono);font-style:normal;color:var(--muted);letter-spacing:0;margin-left:4px}
.hc small{color:var(--muted);font-size:12px;line-height:1.4}
.hc.main{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.hc.main .label,.hc.main small,.hc.main b i{color:var(--accent-fg);opacity:.85}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.strip>div{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0;min-width:0}
.strip b{font:600 1.55rem/1 var(--display);font-variant-numeric:tabular-nums}
.strip small{color:var(--muted);font-size:12px}

section.block{display:flex;flex-direction:column;gap:14px;min-width:0}
.block>header{display:flex;flex-direction:column;gap:3px}
.block>header p{color:var(--muted);font-size:13px;max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.scroll{overflow-x:auto}

/* roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.roster a{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--fg);min-width:0}
.roster a:hover{border-color:var(--accent)}
.roster b{font-weight:600}
.roster small{font:12px var(--mono);color:var(--muted)}

/* stacked bars */
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--skip)}
.stack i{display:block;height:100%}
.stack .c{background:var(--good)} .stack .w{background:var(--bad)} .stack .b{background:var(--skip)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font:12px var(--mono);color:var(--muted)}
.key i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:5px;box-sizing:border-box}
.key i.ln{width:18px;height:0;border-radius:0;border-top:3px solid currentColor;vertical-align:3px}
.key i.dl{width:18px;height:0;border-radius:0;border-top:2px dashed currentColor;vertical-align:3px}
.panel>.key{padding:12px 18px;border-top:1px solid var(--line)}
.nums{font:12px var(--mono);color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.nums b{color:var(--fg);font-weight:500}

/* subject cards */
.subcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sc-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.sc-h strong{font:650 1.05rem var(--display)}
.dot{width:12px;height:12px;border-radius:3px;background:var(--sc);display:inline-block}
.sc .big{font:700 1.9rem/1 var(--display);font-variant-numeric:tabular-nums}
.sc .big i{font:500 .95rem var(--mono);font-style:normal;color:var(--muted);margin-left:4px}
.sc dl{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:0;font-size:13px}
.sc dt{color:var(--muted)} .sc dd{margin:0;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sc p{font-size:12.5px;color:var(--muted)}

.chip{font:500 11px/1 var(--mono);padding:4px 7px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.chip.weak,.chip.down{color:var(--bad)} .chip.mid{color:var(--warn)} .chip.strong,.chip.up{color:var(--good)} .chip.flat{color:var(--muted)}
.subj{font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:4px 6px;border-radius:4px;white-space:nowrap}

/* trend */
.alert{padding:14px 18px;background:var(--warn-bg);border:1px solid var(--warn);border-radius:10px;font-size:14px;max-width:90ch}
.alert b{color:var(--warn)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px}
.cpanel{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cpanel h3{font-size:.95rem}
.cpanel svg{width:100%;height:auto;display:block;overflow:visible}
svg text{font-family:var(--mono)}

/* priority list */
.lead{font-size:15px;max-width:70ch}
.prio{list-style:none;margin:0;padding:0;counter-reset:p}
.prio li{counter-increment:p;display:grid;grid-template-columns:34px 1fr auto;gap:4px 12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.prio li:last-child{border-bottom:0}
.prio li::before{content:counter(p);font:600 1.15rem var(--display);color:var(--muted)}
.prio .nm{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-width:0}
.prio .nm strong{font-weight:600;font-size:15px}
.prio .lost{font:500 13px var(--mono);text-align:right;white-space:nowrap}
@media (max-width:620px){.prio li{grid-template-columns:28px 1fr}.prio .lost{grid-column:2;text-align:left}}

/* collapsibles */
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:10px}
details.fold>summary,details.rv>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
details.fold>summary{padding:14px 18px}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"\25B8";color:var(--muted);transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
details.fold>.fbody{padding:2px 18px 16px;display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);padding-top:14px}
.mgrp{display:flex;flex-direction:column;gap:8px}
.mgrp .qnums{font:13px var(--mono);word-break:break-word}
.mrows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mrows li{display:grid;grid-template-columns:44px 1fr;gap:2px 10px;font-size:13px}
.mrows .qn{font:600 12px var(--mono)}
.mrows .meta{color:var(--muted);font:12px var(--mono)}
details.rv{margin-top:2px}
details.rv>summary{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 0}

/* chapter blocks */
.chapters{display:flex;flex-direction:column}
.chap{padding:16px 18px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.chap:last-child{border-bottom:0}
.chap-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.chap-h strong{font-weight:600;font-size:15px}
.bubbles{display:flex;flex-wrap:wrap;gap:6px}
.q{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:500 11px var(--mono);border:1.5px solid var(--skip);color:var(--muted);background:transparent;padding:0}
.q.sm{width:28px;height:28px;font-size:10.5px}
.q.c{background:var(--good);border-color:var(--good);color:#fff}
.q.w{background:var(--surface);color:var(--bad);border:3px solid var(--bad)}
.q.sel{outline:2px solid var(--accent);outline-offset:2px}
:root[data-theme="dark"] .q.c{color:#0E151C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .q.c{color:#0E151C}}
.advice{font-size:13px;max-width:75ch}
.rev{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.rev>li{display:flex;flex-direction:column;gap:4px;padding-left:12px;border-left:2px solid var(--line)}
.rev .tp{font-weight:600}
.rev ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.rev ul li{font-size:13px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
.tag{font:500 10.5px/1 var(--mono);padding:3px 6px;border-radius:4px;white-space:nowrap}
.tag.w{color:var(--bad);border:1px solid var(--bad)}
.tag.b{color:var(--muted);border:1px solid var(--skip)}
.empty{padding:22px;color:var(--muted)}
.sjh{padding:12px 18px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px}
.sjh:not(:first-child){border-top:1px solid var(--line)}

/* question map */
.sheet{padding:18px;display:flex;flex-direction:column;gap:18px}
.sheet .g{display:flex;flex-direction:column;gap:8px}
.qd{padding:12px 14px;background:var(--surface-2);border-radius:8px;font-size:13px;min-height:3.4em}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right}
table.t td.wrap{white-space:normal;min-width:170px}
table.t td:first-child,table.t th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.linkbtn{color:var(--accent);font-weight:600;text-decoration:none}
.linkbtn:hover{text-decoration:underline}
.pos{color:var(--good)} .neg{color:var(--bad)}
.top3{font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button+button{border-left:1px solid var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.foot{font-size:12px;color:var(--muted);max-width:90ch}
@media (prefers-reduced-motion:no-preference){.stack i{transition:width .3s}}
</style>

</div>

    o.sub[sj]={avg:sum(v.map(x=>x.m))/n,max:v[0].max,avgPct:sum(v.map(x=>x.m))/n/v[0].max,hi:Math.max.apply(null,v.map(x=>x.m)),acc:a.length?sum(a)/a.length:null,att:sum(v.map(x=>x.att))/n};
  });
  return o;
}
const bstats=(T,b)=>BS[T.id+'|'+b]||(BS[T.id+'|'+b]=stats(T,bcoh(T,b)));

/* trends */
function slope(v){const n=v.length;if(n<2)return 0;const mx=(n-1)/2,my=sum(v)/n;let a=0,b=0;v.forEach((y,i)=>{a+=(i-mx)*(y-my);b+=(i-mx)*(i-mx)});return a/b}
const verdict=sl=>sl>=2?{k:'up',t:'Improving',a:'\u25B2'}:sl<=-2?{k:'down',t:'Declining',a:'\u25BC'}:{k:'flat',t:'Steady',a:'\u25C6'};
function trendOf(P,sj){
  const out=[];
  TESTS.forEach(T=>{
    const s=P.per[T.id];if(!s)return;const o=summ(P,T),st=bstats(T,s.branch);
    const m=sj?o.sub[sj]:null;if(sj&&!m)return;
    const v=sj?m.m/m.max*100:o.t/T.max*100,a=sj?st.sub[sj].avgPct*100:st.avg/T.max*100;
    out.push({T:T,v:v,avg:a});
  });
  return out;
}
function trendNotes(P){
  const ov=trendOf(P,null);if(ov.length<2)return null;
  const subs=[];TESTS.forEach(T=>T.subjects.forEach(sj=>{if(subs.indexOf(sj)<0)subs.push(sj)}));
  const o={ov:{sl:slope(ov.map(x=>x.v)),first:ov[0].v,last:ov[ov.length-1].v,n:ov.length},subs:[],hidden:[]};
  o.ov.vd=verdict(o.ov.sl);
  subs.forEach(sj=>{
    const t=trendOf(P,sj);if(t.length<2)return;
    const sl=slope(t.map(x=>x.v)),e={sj:sj,sl:sl,vd:verdict(sl),first:t[0].v,last:t[t.length-1].v,prev:t[t.length-2].v,n:t.length};
    o.subs.push(e);if(sl<=-2&&o.ov.sl>-2)o.hidden.push(e);
  });
  return o;
}

/* ---------- filters ---------- */
function inF(s){const f=S.f;return (f.branch==='all'||s.branch===f.branch)&&(f.cls==='all'||s.cn===f.cls)&&(f.sec==='all'||s.sec===f.sec)&&(f.stu==='all'||s.pid===f.stu)}
const cohort=T=>T.students.filter(inF);
function uniq(a){return a.filter((x,i)=>x&&a.indexOf(x)===i).sort()}
function fixFilters(T){
  const f=S.f,all=T.students;
  if(f.branch!=='all'&&!all.some(s=>s.branch===f.branch))f.branch='all';
  const b=all.filter(s=>f.branch==='all'||s.branch===f.branch);
  if(f.cls!=='all'&&!b.some(s=>s.cn===f.cls))f.cls='all';
  const c=b.filter(s=>f.cls==='all'||s.cn===f.cls);
  if(f.sec!=='all'&&!c.some(s=>s.sec===f.sec))f.sec='all';
  const d=c.filter(s=>f.sec==='all'||s.sec===f.sec);
  if(f.stu!=='all'&&!d.some(s=>s.pid===f.stu))f.stu='all';
}
function filterBar(T){
  fixFilters(T);
  const f=S.f,all=T.students;
  const b=all.filter(s=>f.branch==='all'||s.branch===f.branch),c=b.filter(s=>f.cls==='all'||s.cn===f.cls),d=c.filter(s=>f.sec==='all'||s.sec===f.sec);
  const bo=BRANCHES.map(x=>{const n=all.filter(s=>s.branch===x).length;return '<option value="'+x+'"'+(f.branch===x?' selected':'')+(n?'':' disabled')+'>'+x+(n?' ('+n+')':' (no data yet)')+'</option>'}).join('');
  const opt=(arr,cur,pre)=>'<option value="all">All</option>'+arr.map(x=>'<option value="'+esc(x)+'"'+(cur===x?' selected':'')+'>'+esc((pre||'')+x)+'</option>').join('');
  const so=d.slice().sort((x,y)=>x.name.localeCompare(y.name)).map(s=>'<option value="'+esc(s.pid)+'"'+(f.stu===s.pid?' selected':'')+'>'+esc(s.name)+'</option>').join('');
  const nOn=cohort(T).length;
  return '<div class="filters" role="group" aria-label="Filters">'+
   '<div class="fld"><label class="label" for="fBranch">Branch</label><select id="fBranch"><option value="all">All branches</option>'+bo+'</select></div>'+
   '<div class="fld"><label class="label" for="fCls">Class</label><select id="fCls">'+opt(uniq(b.map(s=>s.cn)),f.cls,'Class ')+'</select></div>'+
   '<div class="fld"><label class="label" for="fSec">Section</label><select id="fSec">'+opt(uniq(c.map(s=>s.sec)),f.sec,'Section ')+'</select></div>'+
   '<div class="fld"><label class="label" for="fStu">Student</label><select id="fStu"><option value="all">All students</option>'+so+'</select></div>'+
   '<div class="fld"><span class="label">Showing</span><span class="mono">'+nOn+' of '+all.length+' students</span></div>'+
   '<button type="button" class="btn ghost" data-reset="1">Reset filters</button></div>';
}
function subjSeg(T){
  return '<div class="seg" role="group" aria-label="Subject focus"><button type="button" data-subj="all" aria-pressed="'+(S.subj==='all')+'">All subjects</button>'+T.subjects.map(sj=>'<button type="button" data-subj="'+esc(sj)+'" aria-pressed="'+(S.subj===sj)+'">'+esc(sj)+'</button>').join('')+'</div>';
}

/* ---------- small views ---------- */
function stack(o){const n=o.n||1;return '<div class="stack" role="img" aria-label="'+o.c+' right, '+o.w+' wrong, '+o.b+' not attempted"><i class="c" style="width:'+(o.c/n*100)+'%"></i><i class="w" style="width:'+(o.w/n*100)+'%"></i><i class="b" style="width:'+(o.b/n*100)+'%"></i></div>'}
function bubble(r,sm){return '<button type="button" class="q '+r.o.toLowerCase()+(sm?' sm':'')+(S.qsel===r.t+':'+r.n?' sel':'')+'" data-q="'+r.t+':'+r.n+'" aria-label="Question '+r.n+': '+(r.o==='C'?'right':r.o==='W'?'wrong':'not attempted')+'">'+r.n+'</button>'}
const legend=()=>'<div class="key"><span><i style="background:var(--good)"></i>Right</span><span><i style="background:var(--surface);border:3px solid var(--bad)"></i>Wrong</span><span><i style="border:1.5px solid var(--skip)"></i>Not attempted</span></div>';
const vchip=vd=>'<span class="chip '+vd.k+'">'+vd.a+' '+vd.t+'</span>';

/* line chart: series=[{name,color,vals,ref,label}] */
function lineChart(o){
  const W=o.w||640,H=o.h||230,m={l:40,r:o.labels.length>1?(o.endLabels?84:18):18,t:18,b:30},n=o.labels.length;
  const all=[];o.series.forEach(s=>s.vals.forEach(v=>{if(v!=null)all.push(v)}));
  let lo=Math.floor((Math.min.apply(null,all)-6)/10)*10,hi=Math.ceil((Math.max.apply(null,all)+6)/10)*10;
  if(hi-lo<30)hi=lo+30;
  const step=(hi-lo)>60?20:10,pw=W-m.l-m.r;
  const x=i=>m.l+(n===1?pw/2:i*pw/(n-1)),y=v=>m.t+(hi-v)/(hi-lo)*(H-m.t-m.b);
  let g='';
  for(let v=lo;v<=hi;v+=step){g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(m.l-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+v+'%</text>'}
  if(lo<0&&hi>0)g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="var(--muted)" stroke-width="1"/>';
  o.labels.forEach((l,i)=>{g+='<text x="'+x(i)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)">'+esc(l)+'</text>'});
  const ends=[];
  o.series.forEach(s=>{
    let d='',first=true;
    s.vals.forEach((v,i)=>{if(v==null){first=true;return}d+=(first?'M':'L')+x(i).toFixed(1)+' '+y(v).toFixed(1);first=false});
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.ref?1.75:2.5)+'"'+(s.ref?' stroke-dasharray="5 4"':'')+' stroke-linejoin="round" stroke-linecap="round"/>';
    s.vals.forEach((v,i)=>{if(v==null)return;
      g+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(v).toFixed(1)+'" r="'+(s.ref?2.5:4.5)+'" fill="'+s.color+'" stroke="var(--surface)" stroke-width="2"><title>'+esc(s.name+' \u00B7 '+o.labels[i]+': '+p1(v)+'%')+'</title></circle>';
      if(!s.ref&&o.vlabels!==false&&n<=8)g+='<text x="'+x(i).toFixed(1)+'" y="'+(y(v)-9).toFixed(1)+'" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--fg)">'+Math.round(v)+'</text>';
    });
    let li=-1;s.vals.forEach((v,i)=>{if(v!=null)li=i});
    if(o.endLabels&&li>=0)ends.push({y:y(s.vals[li]),x:x(li),t:s.label||s.name,c:s.color});
  });
  ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<12)ends[i].y=ends[i-1].y+12;
  ends.forEach(e=>{g+='<text x="'+(e.x+9)+'" y="'+(e.y+3.5)+'" font-size="10.5" font-weight="500" fill="var(--fg)">'+esc(e.t)+'</text>'});
  const lg='<div class="key">'+o.series.map(s=>'<span style="color:'+s.color+'"><i class="'+(s.ref?'dl':'ln')+'"></i><span style="color:var(--muted)">'+esc(s.name)+'</span></span>').join('')+'</div>';
  const desc=o.series.map(s=>s.name+': '+s.vals.map(v=>v==null?'-':Math.round(v)+'%').join(', ')).join('. ');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc((o.title||'Trend')+'. Tests: '+o.labels.join(', ')+'. '+desc)+'">'+g+'</svg>'+lg;
}

/* ---------- student report ---------- */
function missedBlock(kind,rs,T){
  const isW=kind==='W',list=rs.filter(r=>r.o===kind),bySub={};
  const label=isW?'Incorrect':'Not attempted';
  list.forEach(r=>{(bySub[r.subj]=bySub[r.subj]||[]).push(r)});
  const subs=T.subjects.filter(sj=>bySub[sj]);
  const counts=subs.map(sj=>esc(sj)+' '+bySub[sj].length).join(' \u00B7 ');
  const cost=isW?'\u2212'+(list.length*-T.mw)+' marks lost to negative marking':'Up to +'+(list.length*T.mc)+' marks left unclaimed';
  let h='<details class="fold"><summary><span class="tag '+(isW?'w':'b')+'">'+label+'</span><b>'+list.length+' question'+(list.length===1?'':'s')+'</b><span class="muted mono">'+(counts||'None')+'</span></summary>';
  if(!list.length)return '<div class="fold" style="padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span class="tag '+(isW?'w':'b')+'">'+label+'</span><b>0 questions</b><span class="muted">'+(isW?'No wrong answers.':'Every question was attempted.')+'</span></div>';

      v.map(r=>'<li><span class="qn">Q'+r.n+'</span><span><b>'+esc(r.chap)+'</b> \u00B7 '+esc(r.topic)+'<br><span class="meta">'+esc(r.sub)+' \u00B7 '+(isW?'You marked '+esc(r.ans)+', correct is '+esc(r.key):'Correct answer is '+esc(r.key))+'</span></span></li>').join('')+'</ul></div>';
  });
  return h+'</div></details>';
}
function subjectCard(P,T,sm,sj,tn){
  const o=sm.sub[sj],s=sm.s,bs=bstats(T,s.branch).sub[sj],co=bcoh(T,s.branch);

  return h;

/* ---------- analysis ---------- */
const LOW=0.2;
function renderAnalysis(){
  const T=TM[S.tid],co=cohort(T);
  if(S.subj!=='all'&&T.subjects.indexOf(S.subj)<0)S.subj='all';
  let h='<div class="shead"><div class="who"><span class="label">Analysis</span><h2>Chapter and question analysis</h2><span class="muted mono">'+esc(T.name)+' \u00B7 '+fmtDate(T.date)+'</span></div>'+subjSeg(T)+'</div>'+filterBar(T);
  if(!co.length){$('#main').innerHTML=h+'<p class="empty panel">No students match these filters.</p>';return}
  const N=co.length,sub=x=>S.subj==='all'||x===S.subj;
  const allRecs=[];co.forEach(s=>{allRecs.push.apply(allRecs,summ(pOf(s),T).rs)});
  const cm=chapMap(allRecs),chs=Object.keys(cm).map(k=>cm[k]).filter(c=>sub(c.subj)).sort((a,b)=>a.acc-b.acc||b.lost-a.lost);
  const weakCount={};co.forEach(s=>chapters(summ(pOf(s),T).rs).forEach(c=>{if(c.acc<.4)weakCount[c.key]=(weakCount[c.key]||0)+1}));
  h+='<section class="block"><header><h2>Chapters, weakest first</h2><p>Share of all answers in each chapter that were right, wrong or left blank, for the '+N+' student'+(N===1?'':'s')+' in this view. Use this to plan revision classes.</p></header><div class="panel scroll"><table class="t"><thead><tr><th>Chapter</th><th>Subject</th><th class="r">Questions</th><th style="min-width:200px">Right / wrong / blank</th><th class="r">Right</th><th class="r">Students below 40%</th></tr></thead><tbody>'+
    chs.map(c=>{const st=status(c.acc);return '<tr><td class="wrap"><b>'+esc(c.chap)+'</b></td><td><span class="subj" style="color:'+scol(c.subj)+'">'+esc(c.subj)+'</span></td><td class="r">'+(c.n/N)+'</td><td>'+stack(c)+'</td><td class="r"><span class="chip '+st.k+'">'+pc(c.acc)+'</span></td><td class="r">'+(weakCount[c.key]||0)+' of '+N+'</td></tr>'}).join('')+'</tbody></table></div></section>';
  const qs=T.qs.map((q,i)=>{
    let c=0,w=0,b=0;const wo={};
    co.forEach(s=>{const a=s.r[i]==null?'':String(s.r[i]).trim();if(a==='')b++;else if(a.toUpperCase()===String(T.key[i]).toUpperCase())c++;else{w++;wo[a]=(wo[a]||0)+1}});
    const common=Object.keys(wo).sort((x,y)=>wo[y]-wo[x])[0];
    return {n:i+1,q:q,key:T.key[i],c:c,w:w,b:b,common:common,cc:common?wo[common]:0};
  }).filter(r=>sub(r.q.subj));
  const low=qs.filter(r=>r.c/N<=LOW).sort((a,b)=>a.c-b.c||b.b-a.b);
  const why=r=>r.b/N>=.5?'Mostly skipped':(r.cc>=2*Math.max(r.c,1)&&r.cc/N>=.3)?'Strong wrong option '+esc(r.common)+': check the key and discuss in class':'Hard question';
  h+='<section class="block"><header><h2>Questions with unusually low success</h2><p>'+low.length+' of '+qs.length+' questions were answered correctly by '+Math.round(LOW*100)+'% or fewer of the '+N+' students in this view. Go through these in class first.'+(N<5?' This view has very few students, so treat the rates with care.':'')+'</p></header>';
  h+=low.length?'<div class="panel scroll"><table class="t"><thead><tr><th>Q</th><th>Subject</th><th>Chapter</th><th>Topic</th><th class="r">Key</th><th class="r">Right</th><th class="r">Blank</th><th class="r">Most chosen wrong</th><th>Reading</th></tr></thead><tbody>'+
    low.map(r=>'<tr><td class="mono"><b>'+r.n+'</b></td><td><span class="subj" style="color:'+scol(r.q.subj)+'">'+esc(r.q.subj)+'</span></td><td class="wrap">'+esc(r.q.chap)+'</td><td class="wrap">'+esc(r.q.topic)+'</td><td class="r mono">'+esc(r.key)+'</td><td class="r">'+r.c+' <span class="muted">('+pc(r.c/N)+')</span></td><td class="r">'+r.b+' <span class="muted">('+pc(r.b/N)+')</span></td><td class="r mono">'+(r.common?esc(r.common)+' ('+r.cc+')':'\u2013')+'</td><td class="wrap">'+why(r)+'</td></tr>').join('')+'</tbody></table></div>':'<div class="panel"><p class="empty">No question fell at or below that rate.</p></div>';
  h+='</section>';
  const sorted=qs.slice();if(S.sort==='hard')sorted.sort((a,b)=>a.c-b.c||b.w-a.w);
  h+='<section class="block"><header><div class="tools"><h2>Question-wise results</h2><div class="seg" role="group" aria-label="Sort"><button type="button" data-sort="hard" aria-pressed="'+(S.sort==='hard')+'">Hardest first</button><button type="button" data-sort="order" aria-pressed="'+(S.sort==='order')+'">Question order</button></div></div><p>How many of the '+N+' students got each question right. Most chosen wrong shows the option picked most often, with the count.</p></header><div class="panel scroll"><table class="t"><thead><tr><th>Q</th><th>Chapter</th><th>Topic</th><th class="r">Key</th><th class="r">Right</th><th class="r">Wrong</th><th class="r">Blank</th><th class="r">Most chosen wrong</th></tr></thead><tbody>'+
    sorted.map(r=>'<tr><td class="mono"><b>'+r.n+'</b></td><td class="wrap">'+esc(r.q.chap)+'</td><td class="wrap">'+esc(r.q.topic)+'</td><td class="r mono">'+esc(r.key)+'</td><td class="r">'+r.c+' <span class="muted">('+pc(r.c/N)+')</span></td><td class="r">'+r.w+'</td><td class="r">'+r.b+'</td><td class="r mono">'+(r.common?esc(r.common)+' ('+r.cc+')':'\u2013')+'</td></tr>').join('')+'</tbody></table></div></section>';
  $('#main').innerHTML=h;
}

  if(rows.length>1){
    const labels=rows.map(r=>r.T.short);
    h+='<section class="block"><header><h2>Average trend</h2><p>Overall and subject-wise averages for the students in this view. A subject can fall while the overall line rises.</p></header><div class="panel cpanel">'+lineChart({title:'Average percentage by test',labels:labels,endLabels:true,vlabels:false,h:260,series:[{name:'Overall',color:'var(--fg)',vals:rows.map(r=>r.st.avg/r.T.max*100)}].concat(subs.map(sj=>({name:sj,label:sj.slice(0,4),color:scol(sj),vals:rows.map(r=>r.st.sub[sj]?r.st.sub[sj].avgPct*100:null)})))})+'</div></section>';

    const A=TM[S.cmpA],B=TM[S.cmpB],opt=cur=>rows.map(r=>'<option value="'+esc(r.T.id)+'"'+(r.T.id===cur?' selected':'')+'>'+esc(r.T.name)+'</option>').join('');
    const mv=[];
    cohort(A).forEach(sa=>{const P=pOf(sa),sb=P.per[B.id];if(!sb||!inF(sb)||A.id===B.id)return;const a=summ(P,A),b=summ(P,B);mv.push({P:P,a:a,b:b,d:(b.pct-a.pct)*100,sd:subs.map(sj=>a.sub[sj]&&b.sub[sj]?(b.sub[sj].pct-a.sub[sj].pct)*100:null)})});
    mv.sort((x,y)=>y.d-x.d||x.P.name.localeCompare(y.P.name));

      wl.map(x=>'<tr><td><a class="linkbtn" href="#'+x.P.id+'">'+esc(x.P.name)+'</a></td><td>'+(x.hid?'<span class="chip down">Hidden decline</span>':'<span class="chip mid">Overall down</span>')+'</td><td>'+vchip(x.tn.ov.vd)+' <span class="muted mono">'+Math.round(x.tn.ov.first)+'% \u2192 '+Math.round(x.tn.ov.last)+'%</span></td>'+subs.map(sj=>{const e=x.tn.subs.filter(z=>z.sj===sj)[0];return '<td>'+(e?vchip(e.vd)+' <span class="muted mono">'+Math.round(e.first)+'% \u2192 '+Math.round(e.last)+'%</span>':'\u2013')+'</td>'}).join('')+'</tr>').join('')+'</tbody></table></div>':'<div class="panel"><p class="empty">No declining trend in this view.</p></div>';
    h+='</section>';
  }
  $('#main').innerHTML=h;
}

function makePDF(){
  const MM=72/25.4,PH=297,PW=210;
  const WR=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
  const WB=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
  const pages=[];let cur=null;
  const col=c=>c.map(v=>(v/255).toFixed(3)).join(' ');
  const f=n=>(+n).toFixed(2);
  const clean=s=>String(s==null?'':s).replace(/[\u2013\u2014\u2212]/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/\u2192/g,'->').replace(/[\u25B2\u25BC\u25C6]/g,'').replace(/[^\x20-\x7E\u00A0-\u00FF]/g,'?');
  const pe=s=>clean(s).replace(/[\\()]/g,'\\$&').replace(/[\u0080-\u00FF]/g,c=>'\\'+('00'+c.charCodeAt(0).toString(8)).slice(-3));
  const W=(s,size,bold)=>{const t=bold?WB:WR;let w=0;clean(s).split('').forEach(ch=>{const c=ch.charCodeAt(0);w+=(c>=32&&c<=126)?t[c-32]:556});return w*size/1000/MM*1};
  const api={PW:PW,PH:PH,W:W,pages:pages};
  api.addPage=()=>{cur=[];pages.push(cur);return pages.length-1};
  api.use=i=>{cur=pages[i]};
  api.text=(x,y,s,o)=>{o=o||{};const size=o.size||9,w=W(s,size,o.bold);let xx=x;if(o.align==='right')xx=x-w;else if(o.align==='center')xx=x-w/2;
    cur.push('BT '+col(o.color||[21,32,43])+' rg /'+(o.bold?'F2':'F1')+' '+size+' Tf '+f(xx*MM)+' '+f((PH-y)*MM)+' Td ('+pe(s)+') Tj ET')};
  api.rect=(x,y,w,h,o)=>{o=o||{};let op='';if(o.fill)op+=col(o.fill)+' rg ';if(o.stroke)op+=col(o.stroke)+' RG '+f((o.lw||.3)*MM)+' w ';
    cur.push(op+f(x*MM)+' '+f((PH-y-h)*MM)+' '+f(w*MM)+' '+f(h*MM)+' re '+(o.fill&&o.stroke?'B':o.fill?'f':'S'))};
  api.line=(x1,y1,x2,y2,o)=>{o=o||{};cur.push(col(o.color||[211,218,225])+' RG '+f((o.lw||.3)*MM)+' w '+(o.dash?'['+(o.dash*MM).toFixed(1)+'] 0 d ':'[] 0 d ')+f(x1*MM)+' '+f((PH-y1)*MM)+' m '+f(x2*MM)+' '+f((PH-y2)*MM)+' l S')};
  api.poly=(pts,o)=>{o=o||{};let d='';pts.forEach((p,i)=>{d+=f(p[0]*MM)+' '+f((PH-p[1])*MM)+(i?' l ':' m ')});cur.push(col(o.color||[0,0,0])+' RG '+f((o.lw||.6)*MM)+' w '+(o.dash?'['+(o.dash*MM).toFixed(1)+'] 0 d ':'[] 0 d ')+d+'S')};
  api.dot=(x,y,r,c)=>{const k=.5523*r,X=x*MM,Y=(PH-y)*MM,R=r*MM,K=k*MM;cur.push(col(c)+' rg '+f(X+R)+' '+f(Y)+' m '+f(X+R)+' '+f(Y+K)+' '+f(X+K)+' '+f(Y+R)+' '+f(X)+' '+f(Y+R)+' c '+f(X-K)+' '+f(Y+R)+' '+f(X-R)+' '+f(Y+K)+' '+f(X-R)+' '+f(Y)+' c '+f(X-R)+' '+f(Y-K)+' '+f(X-K)+' '+f(Y-R)+' '+f(X)+' '+f(Y-R)+' c '+f(X+K)+' '+f(Y-R)+' '+f(X+R)+' '+f(Y-K)+' '+f(X+R)+' '+f(Y)+' c f')};
  api.wrap=(s,w,size,bold)=>{const out=[];String(s==null?'':s).split('\n').forEach(par=>{let line='';par.split(/\s+/).forEach(word=>{if(!word)return;const t=line?line+' '+word:word;if(W(t,size,bold)<=w||!line)line=t;else{out.push(line);line=word}});out.push(line)});return out};
  api.finish=()=>{
    let out='%PDF-1.4\n',offs=[];const add=(n,b)=>{offs[n]=out.length;out+=n+' 0 obj\n'+b+'\nendobj\n'};
    add(1,'<< /Type /Catalog /Pages 2 0 R >>');
    add(2,'<< /Type /Pages /Kids ['+pages.map((p,i)=>(5+i*2)+' 0 R').join(' ')+'] /Count '+pages.length+' >>');
    add(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    add(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    pages.forEach((p,i)=>{const c=p.join('\n');
      add(5+i*2,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+f(PW*MM)+' '+f(PH*MM)+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+i*2)+' 0 R >>');
      add(6+i*2,'<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream')});
    const n=4+pages.length*2,xr=out.length;
    out+='xref\n0 '+(n+1)+'\n0000000000 65535 f \n';for(let i=1;i<=n;i++)out+=('0000000000'+offs[i]).slice(-10)+' 00000 n \n';
    out+='trailer\n<< /Size '+(n+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
    const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u;
  };
  return api;
}

function reportActions(P,T,sm,tn){
  const out=[],chs=chapters(sm.rs),pr=priority(chs).slice(0,5);
  pr.forEach(c=>{
    const missed=c.rs.filter(r=>r.o!=='C'),tp=[];missed.forEach(r=>{if(tp.indexOf(r.topic)<0)tp.push(r.topic)});
    out.push(c.chap+' ('+c.subj+', '+c.c+' of '+c.n+' right): '+adviceFor(c)+(tp.length?' Start with: '+tp.slice(0,3).join('; ')+'.':''));
  });
  if(tn)tn.hidden.forEach(e=>out.push(e.sj+' is declining across tests ('+Math.round(e.first)+'% to '+Math.round(e.last)+'%) even though overall marks are not. Schedule extra '+e.sj+' practice before the next test.'));
  if(sm.w>0)out.push(sm.w+' wrong answer'+(sm.w===1?'':'s')+' cost '+(sm.w*-T.mw)+' mark'+(sm.w===1?'':'s')+' in negative marking. Attempt a question only when you can eliminate at least one option, and re-check the working of questions you are unsure about.');
  if(sm.b>=10)out.push(sm.b+' questions were left blank (up to '+(sm.b*T.mc)+' marks). In the next test, make a first pass over your strong chapters, then return to the blanks with the time left.');
  if(sm.acc!=null&&sm.acc<.6)out.push('Accuracy is '+Math.round(sm.acc*100)+'% of attempted questions. Slow down on calculation steps and verify units and signs before marking an answer.');
  if(!out.length)out.push('No chapter is below 70% right. Keep practising mixed papers to hold this level.');
  return out;
}

async function savePDF(bytes,name){
  let dl=null;
  try{dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(dl){try{await dl.save({filename:name,data:bytes});return 'saved'}catch(e){if(e&&e.code==='declined')return 'declined';throw e}}
  const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'})),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return 'saved';
}
async function doPDF(){
  const P=PEOPLE[S.pid],btn=$('#pdfBtn'),msg=$('#pdfMsg');if(!P||!btn)return;
  btn.disabled=true;msg.textContent='Preparing the report...';
  try{
    const T=TM[S.tid],bytes=buildPDF(P),name='SagarPS_'+P.branch+'_'+slug(P.name)+'_'+slug(T.short)+'.pdf',r=await savePDF(bytes,name);
    msg.textContent=r==='saved'?'Report ready: '+name:'Download cancelled.';
  }catch(e){msg.textContent='The report could not be saved here ('+(e&&e.code?e.code:'error')+'). Try again from the published page.';try{console.error(e)}catch(_){}}
  btn.disabled=false;
}

/* ---------- routing and events ---------- */
function render(){
  renderChrome();
  if(S.tab==='teacher')renderTeacher();
  else if(S.tab==='analysis')renderAnalysis();
  else if(S.tab==='compare')renderCompare();
  else if(S.pid&&PEOPLE[S.pid])renderReport(PEOPLE[S.pid]);
  else renderLanding();
}
function keepScroll(fn){const y=window.scrollY;fn();try{window.scrollTo(0,y)}catch(e){}}
function route(){
  const h=(location.hash||'').slice(1);
  if(h==='teacher'||h==='analysis'||h==='compare'){S.tab=h;S.pid=null}
  else if(PEOPLE[h]){S.tab='student';S.pid=h}
  else{S.tab='student';S.pid=null}
  S.qsel=null;render();
  try{window.scrollTo(0,0)}catch(e){}
}
document.addEventListener('change',e=>{
  const id=e.target.id,v=e.target.value,f=S.f;
  if(id==='testSel'){S.tid=v;S.qsel=null;keepScroll(render)}
  else if(id==='stuSel')location.hash=v;
  else if(id==='fBranch'){f.branch=v;f.cls=f.sec=f.stu='all';keepScroll(render)}
  else if(id==='fCls'){f.cls=v;f.sec=f.stu='all';keepScroll(render)}
  else if(id==='fSec'){f.sec=v;f.stu='all';keepScroll(render)}
  else if(id==='fStu'){f.stu=v;keepScroll(render)}
  else if(id==='cmpA'){S.cmpA=v;keepScroll(render)}
  else if(id==='cmpB'){S.cmpB=v;keepScroll(render)}
});
document.addEventListener('click',e=>{
  const t=e.target.closest?e.target.closest.bind(e.target):null;if(!t)return;
  const q=t('[data-q]');
  if(q){S.qsel=q.getAttribute('data-q');document.querySelectorAll('.q.sel').forEach(x=>x.classList.remove('sel'));document.querySelectorAll('[data-q="'+S.qsel+'"]').forEach(x=>x.classList.add('sel'));const qd=$('#qd');if(qd)qd.innerHTML=qDetail();return}
  const c=t('[data-comb]');if(c){S.comb=c.getAttribute('data-comb')==='1';S.qsel=null;keepScroll(render);return}
  const so=t('[data-sort]');if(so){S.sort=so.getAttribute('data-sort');keepScroll(render);return}
  const sj=t('[data-subj]');if(sj){S.subj=sj.getAttribute('data-subj');S.qsel=null;keepScroll(render);return}
  if(t('[data-reset]')){S.f={branch:'all',cls:'all',sec:'all',stu:'all'};keepScroll(render);return}
  if(t('[data-pdf]'))doPDF();
});
window.addEventListener('hashchange',route);
route();
})();
</script>

</body></html>
